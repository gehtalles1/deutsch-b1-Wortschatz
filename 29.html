        // Native Audio Synthesizer
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(isCorrect) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;
                if (isCorrect) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Shuffle options and recalculate correct index
        function processQuestions(data) {
            return shuffleArray(data).map(item => {
                const originalOptions = [...item.options];
                const correctAnswerText = originalOptions[item.correctIndex];
                const shuffledOptions = shuffleArray(originalOptions);
                const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
                return {
                    ...item,
                    options: shuffledOptions,
                    answer: newCorrectIndex
                };
            });
        }

        // App State
        let vocabularyData = [];
        let currentIndex = 0;
        let userAnswers = [];
        let showExplanation = false;

        document.addEventListener('DOMContentLoaded', () => {
            resetPractice();
        });

        function resetPractice() {
            // 打乱题目 + 随机化打乱选项顺序 ABCD
            vocabularyData = processQuestions(rawVocabularyData);
            currentIndex = 0;
            userAnswers = new Array(vocabularyData.length).fill(null);
            showExplanation = false;
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('result-container').classList.add('hidden');
            renderQuestion();
        }

                                ${String.fromCharCode(65 + optIndex)}
                            </span>
                            <span class="font-medium">${optText}</span>
                        </span>
                        ${getOptionIcon(optIndex, selectedAnswer, currentData.answer)}
                    </div>
                `;
                btn.onclick = () => selectOption(optIndex);
                optionsGrid.appendChild(btn);
            });

            // Explanation
            const explainCard = document.getElementById('explanation-card');
            const explainText = document.getElementById('explanation-text');
            explainText.textContent = currentData.detail;
            if (showExplanation || isAnswered) {
                explainCard.classList.remove('hidden');
            } else {
                explainCard.classList.add('hidden');
            }

            // Controls
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            const btnNext = document.getElementById('btn-next');
            if (currentIndex === vocabularyData.length - 1) {
                btnNext.textContent = '完成特训';
                btnNext.className = 'px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white shadow-md transition-all';
            } else {
                btnNext.textContent = '下一题';
                btnNext.className = 'px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-900 hover:bg-slate-800 text-white shadow-md transition-all';
            }
        }

        function getOptionStyle(index, selected, correct) {
            const base = "w-full text-left p-4 sm:p-4.5 rounded-2xl border text-sm sm:text-base transition-all duration-200 flex items-center justify-between ";
            if (selected === null) {
                return base + "border-slate-200/80 bg-white hover:border-slate-400 hover:shadow-md text-slate-800";
            }
            if (index === correct) {
                return base + "border-emerald-300 bg-emerald-50/90 text-emerald-900 font-semibold shadow-sm";
            }
            if (index === selected && selected !== correct) {
                return base + "border-rose-300 bg-rose-50/90 text-rose-900 font-semibold shadow-sm";
            }
            return base + "border-slate-100 bg-slate-50/50 text-slate-400 opacity-50";
        }

        function getOptionMarkerStyle(index, selected, correct) {
            if (selected === null) {
                return "border-slate-200 text-slate-500 bg-slate-50";
            }
            if (index === correct) {
                return "border-emerald-500 text-white bg-emerald-600 shadow-sm";
            }
            if (index === selected && selected !== correct) {
                return "border-rose-500 text-white bg-rose-500 shadow-sm";
            }
            return "border-slate-200 text-slate-300 bg-slate-100";
        }

        function getOptionIcon(index, selected, correct) {
            if (selected === null) return '';
            if (index === correct) {
                return `<svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`;
            }
            if (index === selected && selected !== correct) {
                return `<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>`;
            }
            return '';
        }

        function selectOption(index) {
            if (userAnswers[currentIndex] === null) {
                const isCorrect = index === vocabularyData[currentIndex].answer;
                playSound(isCorrect);
            }
            userAnswers[currentIndex] = index;
            showExplanation = true;
            renderQuestion();
        }

        function toggleExplanation() {
            showExplanation = !showExplanation;
            const explainCard = document.getElementById('explanation-card');
            if (showExplanation) {
                explainCard.classList.remove('hidden');
            } else {
                explainCard.classList.add('hidden');
            }
        }

        function nextQuestion() {
            if (currentIndex < vocabularyData.length - 1) {
                currentIndex++;
                showExplanation = false;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                showExplanation = false;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');

            let mistakeCount = 0;
            const mistakesList = document.getElementById('mistakes-list');
            mistakesList.innerHTML = '';

            userAnswers.forEach((ans, idx) => {
                const item = vocabularyData[idx];
                if (ans !== item.answer) {
                    mistakeCount++;
                    const mistakeDiv = document.createElement('div');
                    mistakeDiv.className = 'p-4 bg-slate-50 rounded-2xl border border-slate-200/80 text-xs sm:text-sm';
                    mistakeDiv.innerHTML = `
                        <div class="font-bold text-teal-800 text-sm mb-1">${item.title}</div>
                        <div class="font-german text-slate-800 font-medium mb-1.5">${item.question}</div>
                        <div class="text-slate-600 leading-relaxed">${item.detail}</div>
                    `;
                    mistakesList.appendChild(mistakeDiv);
                }
            });

            document.getElementById('stat-total').textContent = vocabularyData.length;
            document.getElementById('stat-mistakes').textContent = mistakeCount;

            const mistakesSection = document.getElementById('mistakes-section');
            if (mistakeCount > 0) {
                mistakesSection.classList.remove('hidden');
            } else {
                mistakesSection.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
