<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-50/80">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德语 B1 核心词汇特训</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif+Georgia&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-german {
            font-family: 'Noto Serif Georgia', Georgia, serif;
        }
        .custom-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="h-full text-slate-800 antialiased selection:bg-teal-100 selection:text-teal-900 flex flex-col justify-between bg-gradient-to-br from-slate-50 via-zinc-50 to-teal-50/20">
    <!-- Header Area -->
    <header class="sticky top-0 z-30 custom-glass border-b border-slate-200/60 px-4 py-3.5 sm:px-8 shadow-sm">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <a href="index.html" class="inline-flex items-center gap-2 text-xs sm:text-sm font-semibold text-slate-500 hover:text-slate-900 transition-all py-1.5 px-3 rounded-full hover:bg-slate-100/80">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                返回主页
            </a>
            <div class="text-center">
                <h1 class="text-xs sm:text-sm font-bold tracking-widest text-slate-400 uppercase">Wortschatz Training</h1>
                <p class="text-sm sm:text-base font-extrabold text-slate-900 tracking-tight">德语 B1 核心词汇特训</p>
            </div>
            <button onclick="resetPractice()" class="text-xs sm:text-sm font-semibold text-slate-500 hover:text-teal-700 transition-all py-1.5 px-3 rounded-full hover:bg-slate-100/80">
                重新开始
            </button>
        </div>
        <!-- Progress Bar -->
        <div class="max-w-3xl mx-auto mt-3">
            <div class="flex justify-between items-center text-xs font-bold text-slate-400 mb-1.5 tracking-wider uppercase">
                <span id="progress-text">进度：1 / 67</span>
                <span id="progress-percent">1%</span>
            </div>
            <div class="w-full h-1.5 bg-slate-200/70 rounded-full overflow-hidden p-0.5">
                <div id="progress-bar" class="h-full bg-slate-900 transition-all duration-300 rounded-full" style="width: 1%"></div>
            </div>
        </div>
    </header>
    
    <!-- Main Section -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
        <!-- QUIZ CONTAINER -->
        <div id="quiz-container" class="space-y-6">
            <!-- Word Header Card -->
            <div class="bg-white/90 backdrop-blur-sm rounded-3xl p-6 sm:p-9 border border-slate-200/70 shadow-xl shadow-slate-200/50 relative overflow-hidden transition-all">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <span id="word-badge" class="px-3 py-0.5 rounded-full text-xs font-bold tracking-wider uppercase border">
                            Substantiv
                        </span>
                        <span id="target-word" class="text-xs font-semibold text-teal-700 bg-teal-50 px-2.5 py-0.5 rounded-md border border-teal-100">
                            --
                        </span>
                    </div>
                    <span id="question-index-tag" class="text-xs font-bold text-slate-400 tracking-widest uppercase">
                        Q1
                    </span>
                </div>
                <div class="py-2">
                    <p id="question-prompt" class="font-german text-lg sm:text-2xl font-semibold text-slate-800 leading-relaxed sm:leading-relaxed">
                        --
                    </p>
                </div>
            </div>
            <!-- Options Grid -->
            <div id="options-grid" class="grid grid-cols-1 gap-3.5"></div>
            <!-- Explanation Card -->
            <div id="explanation-card" class="hidden bg-slate-900 text-slate-100 rounded-2xl p-5 sm:p-6 shadow-lg border border-slate-800 text-sm leading-relaxed space-y-2">
                <div class="font-semibold text-teal-400 flex items-center gap-2 text-xs sm:text-sm uppercase tracking-wider">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    词汇解析与答案说明
                </div>
                <div id="explanation-text" class="text-slate-300 text-xs sm:text-sm font-normal"></div>
            </div>
        </div>
        
        <!-- RESULT CONTAINER -->
        <div id="result-container" class="hidden bg-white/90 backdrop-blur-sm rounded-3xl p-8 sm:p-10 border border-slate-200/70 shadow-xl shadow-slate-200/50 text-center space-y-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-900 text-teal-400 shadow-lg shadow-slate-900/10 mb-2">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            </div>
            <div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight">特训完成</h2>
                <p class="text-sm text-slate-500 font-medium">已完成本关所有核心词汇测试，熟练掌握巩固知识点</p>
            </div>
            <div class="max-w-md mx-auto py-3 px-6 bg-slate-50 rounded-2xl border border-slate-100 flex items-center justify-around">
                <div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">本次练习题目</div>
                    <div id="stat-total" class="text-2xl font-extrabold text-slate-900">0</div>
                </div>
                <div class="h-8 w-px bg-slate-200"></div>
                <div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">重点标注/错题巩固</div>
                    <div id="stat-mistakes" class="text-2xl font-extrabold text-slate-900">0</div>
                </div>
            </div>
            <!-- Incorrect Words Review List -->
            <div id="mistakes-section" class="text-left hidden space-y-4 pt-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    需重点巩固的词汇
                </h3>
                <div id="mistakes-list" class="space-y-2.5 max-h-64 overflow-y-auto pr-1"></div>
            </div>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-6 border-t border-slate-100">
                <button onclick="resetPractice()" class="w-full sm:w-auto px-8 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm transition-all shadow-md hover:shadow-lg">
                    再练一次
                </button>
                <a href="index.html" class="w-full sm:w-auto px-8 py-3 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-sm transition-all text-center">
                    返回主页
                </a>
            </div>
        </div>
    </main>

    <!-- Bottom Actions Nav -->
    <footer id="bottom-nav" class="sticky bottom-0 z-30 custom-glass border-t border-slate-200/60 px-4 py-3.5 sm:px-8">
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
            <button id="btn-prev" onclick="prevQuestion()" disabled class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold border border-slate-200 text-slate-600 hover:bg-slate-100 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                上一题
            </button>
            <button id="btn-toggle-explain" onclick="toggleExplanation()" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 hover:bg-slate-200/80 text-slate-700 transition-all flex items-center gap-1.5">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                查看释义
            </button>
            <button id="btn-next" onclick="nextQuestion()" class="px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-900 hover:bg-slate-800 text-white shadow-md transition-all">
                下一题
            </button>
        </div>
    </footer>

    <script>
        const rawVocabularyData = [
            // 第一部分
            {
                id: 1, type: 'Adjektiv', badgeClass: 'bg-amber-50 text-amber-700 border-amber-200', title: '【词义辨析】',
                question: '口语中听到 "Das ist aber ______! Normalerweise passiert so etwas nie." 此时空格处填入哪个词表示“奇怪的、古怪的”？',
                options: ['seltsam', 'lustig', 'komplett', 'freundlich'], correctIndex: 0,
                detail: 'seltsam 意为“奇怪的，奇异的”，与 komisch 在此语境中同义。'
            },
            {
                id: 2, type: 'Substantiv', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200', title: '【固定搭配】',
                question: '名词 "das Seminar"（研讨课/专题讨论会）的正确复数形式是？',
                options: ['die Seminare', 'die Seminar', 'die Seminarer', 'die Seminares'], correctIndex: 0,
                detail: 'das Seminar, -e (研讨课)。中性外来词或名词复数直接加 -e。'
            },
            {
                id: 3, type: 'Substantiv', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200', title: '【区域词汇辨析】',
                question: '在奥地利(A)和德国南部，人们常说的 "die Semmel" 在德国北部标准语(D)中对应的是？',
                options: ['das Brötchen', 'der Kuchen', 'die Suppe', 'das Brot'], correctIndex: 0,
                detail: 'die Semmel (A) 相当于德国北部通用的 das Brötchen (小面包)。'
            },
            {
                id: 4, type: 'Verb', badgeClass: 'bg-indigo-50 text-indigo-700 border-indigo-200', title: '【动词变位与变化】',

                options: ['hat gesendet / hat gesandt', 'hat gesendet / hat gesendetet', 'ist gesandt', 'hat gesandt / ist gesandt'], correctIndex: 0,

            },
            {
                id: 5, type: 'Substantiv', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200', title: '【名词复数】',

                options: ['die Sendungen', 'die Sendung', 'die Sendunges', 'die Sendunger'], correctIndex: 0,
                detail: 'die Sendung, -en (节目，邮件/包裹)。以 -ung 结尾的阴性名词复数加 -en。'
            },
            {
                id: 6, type: 'Adjektiv', badgeClass: 'bg-amber-50 text-amber-700 border-amber-200', title: '【方位与几何】',

            },
            {
                id: 7, type: 'Substantiv', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200', title: '【名词复数】',

                options: ['die Serien', 'die Serie', 'die Series', 'die Serier'], correctIndex: 0,

            {

                options: ['die Siege', 'die Siegen', 'die Sieger', 'die Sieges'], correctIndex: 0,

            },
            {
                id: 16, type: 'Substantiv', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200', title: '【人物称谓】',

            },
            {
                id: 17, type: 'Verb', badgeClass: 'bg-indigo-50 text-indigo-700 border-indigo-200', title: '【尊称动词用法】',
                question: '动词 "(sich) siezen" 表示：',
                options: ['用“您” (Sie) 来尊称某人', '用“你” (du) 称呼', '打招呼问候', '自我介绍'], correctIndex: 0,

            {

            {

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }
        function playSound(isCorrect) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;
                if (isCorrect) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        }
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        function processQuestions(data) {
            return shuffleArray(data).map(item => {
                const originalOptions = [...item.options];
                const correctAnswerText = originalOptions[item.correctIndex];
                const shuffledOptions = shuffleArray(originalOptions);
                const newCorrectIndex = shuffledOptions.indexOf(correctAnswerText);
                return {
                    ...item,
                    options: shuffledOptions,
                    answer: newCorrectIndex
                };
            });
        }
        let vocabularyData = [];
        let currentIndex = 0;
        let userAnswers = [];
        let showExplanation = false;
        document.addEventListener('DOMContentLoaded', () => {
            resetPractice();
        });
        function resetPractice() {
            vocabularyData = processQuestions(rawVocabularyData);
            currentIndex = 0;
            userAnswers = new Array(vocabularyData.length).fill(null);
            showExplanation = false;
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('result-container').classList.add('hidden');
            renderQuestion();
        }
        function renderQuestion() {
            const currentData = vocabularyData[currentIndex];
            document.getElementById('word-badge').className = `px-3 py-0.5 rounded-full text-xs font-bold tracking-wider uppercase border ${currentData.badgeClass}`;
            document.getElementById('word-badge').textContent = currentData.type;
            document.getElementById('question-index-tag').textContent = `Q${currentIndex + 1}`;
            document.getElementById('target-word').textContent = currentData.title;
            document.getElementById('question-prompt').textContent = currentData.question;
            const progressPercent = Math.round(((currentIndex + 1) / vocabularyData.length) * 100);
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-text').textContent = `进度：${currentIndex + 1} / ${vocabularyData.length}`;
            document.getElementById('progress-percent').textContent = `${progressPercent}%`;
            
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            const selectedAnswer = userAnswers[currentIndex];
            const isAnswered = selectedAnswer !== null;
            currentData.options.forEach((optText, optIndex) => {
                const btn = document.createElement('button');
                btn.className = getOptionStyle(optIndex, selectedAnswer, currentData.answer);
                btn.innerHTML = `
                    <div class="flex items-center justify-between w-full">
                        <span class="flex items-center gap-3.5">
                            <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold border transition-all ${getOptionMarkerStyle(optIndex, selectedAnswer, currentData.answer)}">
                                ${String.fromCharCode(65 + optIndex)}
                            </span>
                            <span class="font-medium">${optText}</span>
                        </span>
                        ${getOptionIcon(optIndex, selectedAnswer, currentData.answer)}
                    </div>
                `;
                btn.onclick = () => selectOption(optIndex);
                optionsGrid.appendChild(btn);
            });
            const explainCard = document.getElementById('explanation-card');
            const explainText = document.getElementById('explanation-text');
            explainText.textContent = currentData.detail;
            if (showExplanation || isAnswered) {
                explainCard.classList.remove('hidden');
            } else {
                explainCard.classList.add('hidden');
            }
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            const btnNext = document.getElementById('btn-next');
            if (currentIndex === vocabularyData.length - 1) {
                btnNext.textContent = '完成特训';
                btnNext.className = 'px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white shadow-md transition-all';
            } else {
                btnNext.textContent = '下一题';
                btnNext.className = 'px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-900 hover:bg-slate-800 text-white shadow-md transition-all';
            }
        }
        function getOptionStyle(index, selected, correct) {
            const base = "w-full text-left p-4 sm:p-4.5 rounded-2xl border text-sm sm:text-base transition-all duration-200 flex items-center justify-between ";
            if (selected === null) {
                return base + "border-slate-200/80 bg-white hover:border-slate-400 hover:shadow-md text-slate-800";
            }
            if (index === correct) {
                return base + "border-emerald-300 bg-emerald-50/90 text-emerald-900 font-semibold shadow-sm";
            }
            if (index === selected && selected !== correct) {
                return base + "border-rose-300 bg-rose-50/90 text-rose-900 font-semibold shadow-sm";
            }
            return base + "border-slate-100 bg-slate-50/50 text-slate-400 opacity-50";
        }
        function getOptionMarkerStyle(index, selected, correct) {
            if (selected === null) {
                return "border-slate-200 text-slate-500 bg-slate-50";
            }
            if (index === correct) {
                return "border-emerald-500 text-white bg-emerald-600 shadow-sm";
            }
            if (index === selected && selected !== correct) {
                return "border-rose-500 text-white bg-rose-500 shadow-sm";
            }
            return "border-slate-200 text-slate-300 bg-slate-100";
        }
        function getOptionIcon(index, selected, correct) {
            if (selected === null) return '';
            if (index === correct) {
                return `<svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`;
            }
            if (index === selected && selected !== correct) {
                return `<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>`;
            }
            return '';
        }
        function selectOption(index) {
            if (userAnswers[currentIndex] === null) {
                const isCorrect = index === vocabularyData[currentIndex].answer;
                playSound(isCorrect);
            }
            userAnswers[currentIndex] = index;
            showExplanation = true;
            renderQuestion();
        }
        function toggleExplanation() {
            showExplanation = !showExplanation;
            const explainCard = document.getElementById('explanation-card');
            if (showExplanation) {
                explainCard.classList.remove('hidden');
            } else {
                explainCard.classList.add('hidden');
            }
        }
        function nextQuestion() {
            if (currentIndex < vocabularyData.length - 1) {
                currentIndex++;
                showExplanation = false;
                renderQuestion();
            } else {
                showResults();
            }
        }
        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                showExplanation = false;
                renderQuestion();
            }
        }
        function showResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            let mistakeCount = 0;
            const mistakesList = document.getElementById('mistakes-list');
            mistakesList.innerHTML = '';
            userAnswers.forEach((ans, idx) => {
                const item = vocabularyData[idx];
                if (ans !== item.answer) {
                    mistakeCount++;
                    const mistakeDiv = document.createElement('div');
                    mistakeDiv.className = 'p-4 bg-slate-50 rounded-2xl border border-slate-200/80 text-xs sm:text-sm';
                    mistakeDiv.innerHTML = `
                        <div class="font-bold text-teal-800 text-sm mb-1">${item.title}</div>
                        <div class="font-german text-slate-800 font-medium mb-1.5">${item.question}</div>
                        <div class="text-slate-600 leading-relaxed">${item.detail}</div>
                    `;
                    mistakesList.appendChild(mistakeDiv);
                }
            });
            document.getElementById('stat-total').textContent = vocabularyData.length;
            document.getElementById('stat-mistakes').textContent = mistakeCount;
            const mistakesSection = document.getElementById('mistakes-section');
            if (mistakeCount > 0) {
                mistakesSection.classList.remove('hidden');
            } else {
                mistakesSection.classList.add('hidden');
            }
        }
    </script>
